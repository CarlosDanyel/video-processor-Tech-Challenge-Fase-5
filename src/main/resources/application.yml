spring:
  application:
    name: video-processor
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:fiapx}
    password: ${RABBIT_PASSWORD:change-me}
    publisher-confirm-type: correlated
    listener:
      simple:
        prefetch: 1
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 2000ms
server:
  port: 8081
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
storage:
  endpoint: ${S3_ENDPOINT:http://localhost:9000}
  access-key: ${S3_ACCESS_KEY:fiapx}
  secret-key: ${S3_SECRET_KEY:change-me}
  bucket: ${S3_BUCKET:videos}
